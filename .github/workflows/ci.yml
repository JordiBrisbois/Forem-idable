name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The build does not need real secrets: branding is injected at runtime,
      # but the modules validate their environment at import time.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      AUDIT_HASH_SECRET: ci-audit-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_HASH_SECRET: ci-audit-secret
      E2E_REAL_DB: "1"
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # Feature flags matching a demo/self-hosted instance, so the specs exercise
      # the same surfaces (job search, public registration, password reset).
      FEATURE_JOB_SEARCH: "true"
      ALLOW_PUBLIC_REGISTRATION: "true"
      PASSWORD_RESET_ENABLED: "true"
      NEXT_PUBLIC_PASSWORD_RESET_ENABLED: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        # global-setup resets the database and bootstraps the admin.
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      AUDIT_HASH_SECRET: ci-audit-secret
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        # Same major as the managed instance, so the client upgrade is validated
        # against the server version actually deployed.
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Redis integration tests
        # Skipped elsewhere (no REDIS_URL), so this job is the only place the
        # real protocol path runs.
        run: npx vitest run src/lib/server/redis.integration.test.ts

  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_HASH_SECRET: ci-audit-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # The gate the suites look for. DATABASE_URL alone is not enough: the
      # quality job exports one too, without a server behind it.
      RUN_DB_INTEGRATION: "1"
    services:
      postgres:
        # Same major as the E2E job and the deployment target, so the SQL is
        # validated against the version that actually runs it.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Postgres integration tests
        # One file at a time: each suite truncates the shared tables in
        # beforeEach, so files must not run concurrently against one database.
        # Migrations are applied by ensureDatabase() on first use.
        run: npx vitest run integration --no-file-parallelism

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The only job that sees .dockerignore: `tsc` and `next build` in
      # `quality` type-check the full checkout, so an import pointing outside
      # the Docker build context passes there and fails at deploy time. This
      # builds the real Dockerfile with the build args Coolify injects.
      - name: Build the production image
        run: |
          docker build \
            --progress=plain \
            --build-arg DATABASE_URL='postgres://postgres:postgres@localhost:5432/app' \
            --build-arg AUDIT_HASH_SECRET='ci-audit-secret' \
            --tag forem-idable:ci \
            .

      # Building is not booting: the runner stage (standalone output, the
      # drizzle/ and scripts/ copies, `node server.js`) runs nowhere else in CI,
      # and the E2E suite drives `next dev`. Any HTTP status proves the
      # production server is listening; no database is attached here, so a 5xx
      # is a valid answer and only a dead port fails.
      - name: Smoke test the image
        run: |
          docker run --detach --name forem-ci --publish 3000:3000 \
            --env DATABASE_URL='postgres://postgres:postgres@localhost:5432/app' \
            --env AUDIT_HASH_SECRET='ci-audit-secret' \
            forem-idable:ci

          for second in $(seq 1 45); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3000/ || true)
            if [ "$status" != "000" ]; then
              echo "production server answered HTTP $status after ${second}s"
              exit 0
            fi
            if [ -z "$(docker ps --quiet --filter name=forem-ci)" ]; then
              echo "container exited before answering a single request"
              exit 1
            fi
            sleep 1
          done

          echo "container never answered on port 3000 within 45s"
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs forem-ci || true

      - name: Remove the container
        if: always()
        run: docker rm --force forem-ci || true



