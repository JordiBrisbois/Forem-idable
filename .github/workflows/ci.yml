name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The build does not need real secrets: branding is injected at runtime,
      # but the modules validate their environment at import time.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      AUDIT_HASH_SECRET: ci-audit-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_HASH_SECRET: ci-audit-secret
      E2E_REAL_DB: "1"
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      # Feature flags matching a demo/self-hosted instance, so the specs exercise
      # the same surfaces (job search, public registration, password reset).
      FEATURE_JOB_SEARCH: "true"
      ALLOW_PUBLIC_REGISTRATION: "true"
      PASSWORD_RESET_ENABLED: "true"
      NEXT_PUBLIC_PASSWORD_RESET_ENABLED: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        # global-setup resets the database and bootstraps the admin.
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
