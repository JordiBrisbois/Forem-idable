version: 2
updates:
  # Keep the runtime dependencies (Next.js, React, drizzle-orm, pg…) current:
  # this is where the security-relevant advisories land.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    # Majors deliberately parked: typescript and @types/node are covered in
    # docs/technical-debt.md §3, lucide-react is a documented non-goal (the 0.x
    # line is still actively released). Silencing them here keeps the queue
    # readable for the upgrades that are actually actionable; security updates
    # are not affected by `update-types` ignores.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the routine patch/minor noise.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security fixes never wait for the weekly window.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    # The Node base image is pinned to an exact LTS patch on purpose: a runtime
    # change ships as its own reviewed commit (Dockerfile + @types/node + the
    # Node version used by CI), never as a tag move. See technical-debt.md §3.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
